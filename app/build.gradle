plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.chaquo.python'
}

android {
    namespace 'ir.nimacurly.curlybot'
    compileSdk 34

    defaultConfig {
        applicationId "ir.nimacurly.curlybot"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        ndk { abiFilters "arm64-v8a", "armeabi-v7a" }

        python {
            version "3.11"
            pip {
                // همان نسخه‌هایی که روی اندروید با Chaquopy ساخته می‌شوند
                install "highrise-bot-sdk==25.1.0"
                install "aiohttp==3.10.10"
                install "multidict==5.1.0"
                install "frozenlist==1.4.0"
                install "pendulum==2.1.2"
                install "cattrs==22.2.0"
                install "quattro==22.2.0"
            }
        }
    }

    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = "17" }
    buildFeatures { compose true }
    composeOptions { kotlinCompilerExtensionVersion "1.5.10" }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.02.02')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
}
