plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.chaquo.python'
}

android {
    namespace 'ir.nimacurly.curlybot'
    compileSdk 34

    defaultConfig {
        applicationId "ir.nimacurly.curlybot"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        ndk { abiFilters "arm64-v8a", "armeabi-v7a" }

        python {
            version "3.11"
            pip {
                // highrise-bot-sdk به typing_extensions<4 گیر می‌ده، پس وابستگی‌ها دستی و
                // با همون نسخه‌های سالمِ اپ قبلی نصب می‌شن (--no-deps).
                // pendulum عمداً نیست: نسخه‌ی سبک خودمون توی python/pendulum جاشه.
                options "--no-deps"
                install "typing_extensions==4.16.0"
                install "highrise-bot-sdk==25.1.0"
                install "aiohttp==3.10.10"
                install "aiohappyeyeballs==2.7.1"
                install "aiosignal==1.4.0"
                install "attrs==26.1.0"
                install "cattrs==22.2.0"
                install "click==8.5.0"
                install "frozenlist==1.4.0"
                install "idna==3.20"
                install "multidict==5.1.0"
                install "propcache==0.5.4"
                install "quattro==22.2.0"
                install "yarl==1.25.1"
            }
        }
    }

    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = "17" }
    buildFeatures { compose true }
    composeOptions { kotlinCompilerExtensionVersion "1.5.10" }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.02.02')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
}
